<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="intro/aa-intro.css" />
  <style>
    /* ---- Bundled brand fonts (MV3: no remote CDN, all local woff2) ---- */
    @font-face {
      font-family: "Sora"; font-style: normal; font-weight: 600;
      font-display: swap; src: url("fonts/sora-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Sora"; font-style: normal; font-weight: 700;
      font-display: swap; src: url("fonts/sora-700.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter"; font-style: normal; font-weight: 400;
      font-display: swap; src: url("fonts/inter-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter"; font-style: normal; font-weight: 500;
      font-display: swap; src: url("fonts/inter-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter"; font-style: normal; font-weight: 600;
      font-display: swap; src: url("fonts/inter-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400;
      font-display: swap; src: url("fonts/ibmplexmono-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500;
      font-display: swap; src: url("fonts/ibmplexmono-500.woff2") format("woff2");
    }

    :root {
      /* ActivationAgents dark brand kit */
      --bg: #09090d;
      --panel: #121219;
      --panel-2: #0c0c11;
      --line: #20202a;
      --fg: #ececf1;
      --muted: #8c8c98;
      --faint: #5a5a66;
      --accent: #a273f5;
      --accent-2: #c79fff;
      --p1: #7c45db;
      --p2: #a273f5;
      --p3: #c79fff;
      --black: #050505;
      --ok: #3ddc84;
      --err: #ff6b6b;
      --accent-bar: linear-gradient(90deg, #7c45db, #a273f5, #c79fff);

      --font-display: "Sora", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --radius: 15px;
      --radius-sm: 11px;
    }

    * { box-sizing: border-box; }

    /* Opaque, edge-to-edge surface: Chrome can't make popup areas see-through,
       so we fill the whole popup — no exposed/white anywhere. Corner rounding
       comes from Chrome's own popup window. */
    html { background: var(--bg); }

    body {
      width: 390px;
      margin: 0;
      background:
        radial-gradient(120% 70% at 50% -8%, rgba(124, 69, 219, 0.16), rgba(124, 69, 219, 0) 60%),
        var(--bg);
      color: var(--fg);
      font: 400 13px/1.45 var(--font-body);
      padding: 14px;
      -webkit-font-smoothing: antialiased;
    }
    /* Neutralized wrapper (kept for structure; surface lives on body now) */
    .bubble { position: relative; }

    /* ---------- Header / logo lockup ---------- */
    .lockup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--black);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 15px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset,
                  0 8px 26px rgba(124, 69, 219, 0.14);
    }
    .lockup .wordmark { height: 15px; width: auto; display: block; }

    .dot {
      flex: 0 0 auto;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--faint);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .dot.ok  { background: var(--ok);  box-shadow: 0 0 10px rgba(61, 220, 132, 0.8),  0 0 0 3px rgba(61, 220, 132, 0.12); }
    .dot.err { background: var(--err); box-shadow: 0 0 10px rgba(255, 107, 107, 0.8), 0 0 0 3px rgba(255, 107, 107, 0.12); }

    .accent-bar {
      height: 3px;
      border-radius: 3px;
      margin: 11px 2px 14px;
      background: var(--accent-bar);
      box-shadow: 0 0 14px rgba(162, 115, 245, 0.45);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 2px 12px;
    }
    .titlebar h1 {
      font: 600 15px/1.1 var(--font-display);
      margin: 0;
      letter-spacing: 0.01em;
    }
    .tag {
      font: 500 9.5px/1 var(--font-body);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-2);
      border: 1px solid rgba(162, 115, 245, 0.35);
      background: rgba(162, 115, 245, 0.08);
      padding: 4px 7px;
      border-radius: 999px;
    }

    /* ---------- Fields ---------- */
    label {
      display: block;
      color: var(--muted);
      font: 500 10px/1 var(--font-body);
      margin: 13px 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select, textarea, input {
      width: 100%;
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      font: 400 12px/1.5 var(--font-mono);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    select {
      font-family: var(--font-body);
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) 51%, calc(100% - 11px) 51%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }
    textarea { resize: vertical; word-break: break-all; }
    /* Default to the same height as the single-line API-key box (drag to expand) */
    textarea.rt { height: 40px; min-height: 40px; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(162, 115, 245, 0.18);
    }

    .field { display: flex; gap: 8px; align-items: stretch; }
    .field > textarea, .field > input { flex: 1; }

    .copy-btn {
      flex: 0 0 auto;
      width: 70px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--fg);
      border-radius: var(--radius-sm);
      font: 600 12px/1 var(--font-body);
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .copy-btn:hover {
      border-color: rgba(162, 115, 245, 0.55);
      color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(162, 115, 245, 0.12);
    }
    .copy-btn:active { transform: translateY(1px); }

    .copy-both {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 12px;
      color: #0d0616;
      font: 600 13px/1 var(--font-body);
      letter-spacing: 0.01em;
      cursor: pointer;
      background: var(--accent-bar);
      box-shadow: 0 6px 20px rgba(124, 69, 219, 0.4);
      transition: filter 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
    }
    .copy-both:hover { filter: brightness(1.08); box-shadow: 0 8px 26px rgba(124, 69, 219, 0.55); }
    .copy-both:active { transform: translateY(1px); }

    /* ---------- Card wrapper for the result ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 4px 15px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .meta {
      color: var(--muted);
      font: 400 11px/1.4 var(--font-body);
      margin-top: 10px;
    }
    .meta:empty { display: none; }
    .meta.err { color: var(--err); }

    /* ---------- Loading / empty / error states ---------- */
    #loading {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font: 400 12px/1.3 var(--font-body);
      padding: 20px 4px;
    }
    .spinner {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(162, 115, 245, 0.25);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #empty {
      background: var(--panel);
      border: 1px solid rgba(255, 107, 107, 0.28);
      border-radius: var(--radius);
      padding: 20px 18px;
      text-align: center;
      color: var(--muted);
      font: 400 12px/1.5 var(--font-body);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    #empty::before {
      content: "";
      display: block;
      width: 40px; height: 24px;
      margin: 0 auto 12px;
      background: var(--accent-bar);
      opacity: 0.85;
      -webkit-mask: url("intro/activationagents-icon.svg") center/contain no-repeat;
      mask: url("intro/activationagents-icon.svg") center/contain no-repeat;
    }

    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <script src="intro/aa-intro.js"></script>

  <div class="bubble">

  <header class="lockup">
    <img class="wordmark" src="intro/activationagents-logo.svg" alt="ActivationAgents" />
    <span id="status-dot" class="dot" title="Session status"></span>
  </header>

  <div class="accent-bar"></div>

  <div class="titlebar">
    <h1>Firebase Token Puller</h1>
    <span class="tag">Internal</span>
  </div>

  <div id="loading">
    <span class="spinner" aria-hidden="true"></span>
    Reading session on this tab…
  </div>

  <div id="main" class="hidden card">
    <label for="account">Signed-in account</label>
    <input id="accountStatic" class="hidden" readonly spellcheck="false" />
    <select id="account" class="hidden"></select>

    <label for="apiKey">API key</label>
    <div class="field">
      <input id="apiKey" readonly spellcheck="false" />
      <button class="copy-btn" data-src="apiKey">Copy</button>
    </div>

    <label for="refreshToken">Refresh token</label>
    <div class="field">
      <textarea id="refreshToken" class="rt" readonly spellcheck="false"></textarea>
      <button class="copy-btn" data-src="refreshToken">Copy</button>
    </div>

    <button id="copyBoth" class="copy-both">Copy both (API key + refresh token)</button>
    <div id="meta" class="meta"></div>
  </div>

  <div id="empty" class="hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
